name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Pack the tarball
        run: |
          npm pack
          mv tudelft-mcp-*.tgz tudelft-mcp.tgz
          tar -tzf tudelft-mcp.tgz | head -20
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: tudelft-mcp.tgz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      # Trusted publishing: npm accepts this workflow's OIDC token, so no npm token is stored as a
      # secret. It needs npm 11.5.1 or newer, which is newer than the npm that ships with Node 22.
      - name: Publish to npm
        run: |
          npm install -g npm@11
          npm publish --provenance --access public
