name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you paste anything: remove course names, course codes, org unit ids, student numbers, names, tokens, cookies and anything from `~/.tudelft-mcp`. Redact URLs that carry a query string.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tudelft-mcp --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.17.1
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Which client you were using, with its version if you know it.
      placeholder: Claude Desktop 1.2.3
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the tool name and the error code if a tool returned one.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `tudelft-mcp status`
      description: Paste it as is. It contains no secrets, but check the account fields before posting if you prefer to redact them.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything printed to the terminal or the client's MCP log, redacted.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: I removed personal data, course data and session material from this report.
          required: true
        - label: I ran `tudelft-mcp status` and the problem is not a sign-in that simply expired.
