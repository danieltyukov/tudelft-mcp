<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="tudelft-mcp: your TU Delft courses, in your AI assistant">
  <rect width="1200" height="630" fill="#0B1220"/>
  <g transform="translate(100 140) scale(2.5)">
    <rect width="64" height="64" rx="14" fill="#0F1B2D"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#22304A"/>
    <g fill="#2F80ED">
      <rect x="25" y="44" width="4" height="10" rx="1.5"/>
      <rect x="35" y="44" width="4" height="10" rx="1.5"/>
    </g>
    <g fill="#5EEAD4">
      <rect x="13" y="11" width="38" height="8" rx="2.5"/>
      <rect x="28" y="11" width="8" height="30"/>
      <rect x="21" y="37" width="22" height="9" rx="3"/>
    </g>
  </g>
  <text x="300" y="248" fill="#E6EDF7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="84" font-weight="600" letter-spacing="-2">tudelft-mcp</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
